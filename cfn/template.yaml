AWSTemplateFormatVersion: '2010-09-09'
Description: P08 DevOps Assistant - Lambda functions + IAM roles + SNS

Parameters:
  Environment:
    Type: String
    Default: dev

Resources:

  # ── SNS Alert Topic ──────────────────────────────────────────
  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub p08-ph1-devops-assistant-${Environment}-alerts
      DisplayName: DevOps Assistant Alerts

  # ── Lambda IAM Role ──────────────────────────────────────────
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub p08-ph1-devops-assistant-${Environment}-lambda-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: CloudWatchReadAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:FilterLogEvents
                  - logs:DescribeLogGroups
                  - logs:DescribeLogStreams
                  - cloudwatch:GetMetricStatistics
                  - cloudwatch:ListMetrics
                  - lambda:ListFunctions
                  - lambda:GetFunction
                Resource: '*'
        - PolicyName: CostExplorerAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ce:GetCostAndUsage
                  - ce:GetCostForecast
                Resource: '*'
        - PolicyName: SNSPublishAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - sns:Publish
                Resource: !Ref AlertTopic

Outputs:
  LambdaExecutionRoleArn:
    Value: !GetAtt LambdaExecutionRole.Arn
    Export:
      Name: !Sub p08-${Environment}-lambda-role-arn

  AlertTopicArn:
    Value: !Ref AlertTopic
    Export:
      Name: !Sub p08-${Environment}-alert-topic-arn
